worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    # ── Upstream services ───────────────────────────────────────────────────
    upstream node_backend {
        server app:3001;
        keepalive 32;
    }

    upstream python_backend {
        server python-backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── API Gateway monitoring routes → Python FastAPI ──────────────────
        # AWS APIs, stages, routes, throttle, test-request
        location ~ ^/api/aws/(apis|stages|routes|throttle-stage|test-request|metrics|logs|log-groups|traces) {
            proxy_pass         http://python_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization $http_authorization;
            proxy_read_timeout 60s;
        }

        # Fleet summary and comparison
        location ~ ^/api/gateways/ {
            proxy_pass         http://python_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization $http_authorization;
            proxy_read_timeout 60s;
        }

        # Anomaly detection
        location /api/anomalies {
            proxy_pass         http://python_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Authorization $http_authorization;
        }

        # FinOps cost analysis
        location /api/finops/ {
            proxy_pass         http://python_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Authorization $http_authorization;
        }

        # SLA compliance PDF report
        location /api/reports/sla-compliance {
            proxy_pass         http://python_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Authorization $http_authorization;
            proxy_read_timeout 30s;
        }

        # Gateway alert rules and monitored gateways
        location ~ ^/api/alerts/(rules|monitored-gateways|history) {
            proxy_pass         http://python_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Authorization $http_authorization;
        }

        # Diagnostics
        location /api/diagnostics/ {
            proxy_pass         http://python_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Authorization $http_authorization;
            proxy_read_timeout 30s;
        }

        # OTLP ingestion (traces + metrics)
        location ~ ^/v1/(traces|metrics) {
            proxy_pass         http://python_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            client_max_body_size 50m;
        }

        # CloudWatch push ingestion
        location /api/ingest/ {
            proxy_pass         http://python_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            client_max_body_size 50m;
        }

        # Python health endpoint
        location /api/gateway-service/health {
            proxy_pass         http://python_backend/health;
            proxy_set_header   Host $host;
        }

        # ── Everything else → Node.js ────────────────────────────────────────
        location / {
            proxy_pass         http://node_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Authorization $http_authorization;
            proxy_read_timeout 120s;

            # WebSocket upgrade support
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
